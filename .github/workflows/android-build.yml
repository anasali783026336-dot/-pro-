name: Build Data Guardian PRO APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Ensure Keystore and Secrets Config
        run: |
          # 1. Ensure .env file exists so secrets-gradle-plugin is satisfied
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 2. Ensure debug.keystore exists for signingConfig 'debugConfig'
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore with keytool..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh debug.keystore

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon --stacktrace
          else
            gradle testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK Generated
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::لم يتم العثور على ملف APK الناتج في المسار المتوقع!"
            exit 1
          fi
          echo "تم العثور على APK في المسار: $APK_PATH"
          echo "حجم الملف: $(ls -lh $APK_PATH | awk '{print $5}')"
          # Create clean direct APK copy
          cp "$APK_PATH" "DataGuardianPRO-v1.0-debug.apk"
          sha256sum "DataGuardianPRO-v1.0-debug.apk"
          echo "APK_OUTPUT_PATH=DataGuardianPRO-v1.0-debug.apk" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataGuardianPRO-Debug-APK
          path: ${{ env.APK_OUTPUT_PATH }}
          retention-days: 14
